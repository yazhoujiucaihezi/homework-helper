<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="author" content="yazhoujiucaihezi" />
<meta property="og:site_name" content="yazhoujiucaihezi" />
<meta property="og:title" content="速答 · 作业答案卡" />
<title>速答 · 作业答案卡</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4.5 13.5H11l-1 8.5L18.5 10H12l1-8z"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>速答</strong>
        <span>粘贴题目 · 出答案卡</span>
      </div>
      <button class="icon-btn only-mobile" id="btnCloseSide" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="btn-new" id="btnNew">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建
    </button>

    <div class="side-scroll">
      <div class="side-label">科目</div>
      <div class="chips" id="subjectChips"></div>

      <div class="side-label" style="margin-top:18px">学段</div>
      <div class="select-wrap">
        <select id="gradeSelect">
          <option>小学</option>
          <option>初中</option>
          <option>高中</option>
          <option selected>大学 / 成人</option>
        </select>
      </div>

      <div class="side-label" style="margin-top:18px">历史</div>
      <div class="conv-list" id="convList"></div>
    </div>

    <div class="side-foot">
      <button class="btn-ghost" id="btnSettings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9c.26.62.87 1.03 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
        </svg>
        API 设置
      </button>
      <div class="model-badge" id="modelBadge"><i class="dot"></i><span>未配置模型</span></div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">新任务</div>
      <div class="topbar-actions">
        <a class="icon-btn" href="https://github.com/yazhoujiucaihezi" target="_blank" rel="noopener" title="GitHub · yazhoujiucaihezi" aria-label="GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a class="icon-btn" href="install.html" title="安装浏览器脚本">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <button class="icon-btn" id="btnExport" title="导出 CSV">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 20h16"/></svg>
        </button>
        <button class="icon-btn" id="btnClear" title="清空当前">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6.5 7l.8 13h9.4l.8-13"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <div class="welcome-badge">纯本地运行 · Key 只存在你的浏览器</div>
          <h1>题目粘进来，答案卡拿走</h1>
          <p class="welcome-sub">一整套单选、判断、填空、简答，一次贴完。<br/>自动按题号对齐，复制后直接往答题框里填。</p>
          <div class="cards" id="exampleCards">
            <button class="card" data-fill="1. 下列函数中，在区间 (0,+∞) 上单调递减的是（　）&#10;A. y=x²  B. y=ln x  C. y=1/x  D. y=e^x&#10;2. 若 log₂x = 3，则 x = ______。&#10;3. 判断：两条平行线被第三条直线所截，内错角相等。（　）">
              <span class="card-tag">示例</span>
              <span class="card-title">一套混合题</span>
              <span class="card-desc">单选 + 填空 + 判断，看对齐效果</span>
            </button>
            <button class="card" data-fill="1. 中国共产党第一次全国代表大会召开的时间和地点是（　）&#10;A. 1921年·上海  B. 1921年·北京  C. 1927年·南昌  D. 1919年·北京&#10;2. 新民主主义革命的开端是（　）&#10;A. 辛亥革命  B. 五四运动  C. 中共成立  D. 北伐战争">
              <span class="card-tag">示例</span>
              <span class="card-title">连排选择题</span>
              <span class="card-desc">输出 1.A 2.B，一行粘完</span>
            </button>
          </div>
          <p class="welcome-tip">还没配置接口？点左下角 <b>API 设置</b>，填 Base URL、Key 和模型名就能开工，只存在本机。</p>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="composer-wrap">
      <div class="mode-bar" id="modeBar"></div>
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="把题目整段粘进来（可多题，自动按题号切分）…"></textarea>
        <div class="composer-foot">
          <div class="left">
            <span class="hint" id="hintText">Enter 发送 · Shift+Enter 换行</span>
          </div>
          <button class="btn-send" id="btnSend">
            <span id="sendLabel">出答案</span>
            <svg id="sendIcon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">答案仅供参考，提交前自己扫一眼 · <a href="https://github.com/yazhoujiucaihezi" target="_blank" rel="noopener">GitHub</a></div>
    </div>
  </main>
</div>

<div class="modal" id="settingsModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h2>API 设置</h2>
      <button class="icon-btn" id="btnCloseSettings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" type="text" spellcheck="false" placeholder="https://your-endpoint/v1" />
        <span class="field-hint">需兼容 <code>/chat/completions</code> 接口</span>
      </div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" spellcheck="false" placeholder="sk-..." autocomplete="off" />
        <span class="field-hint">只写入本机浏览器 localStorage，不会发到任何第三方</span>
      </div>
      <div class="field">
        <label for="model">模型名</label>
        <input id="model" type="text" spellcheck="false" placeholder="your-model" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="temperature">随机性 temperature</label>
          <input id="temperature" type="number" min="0" max="2" step="0.1" value="0" />
        </div>
        <div class="field">
          <label for="judgeFmt">判断题输出</label>
          <div class="select-wrap">
            <select id="judgeFmt">
              <option value="word">对 / 错</option>
              <option value="ab">A / B</option>
              <option value="mark">√ / ×</option>
            </select>
          </div>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="forceJson" checked />
        <span>强制 JSON 输出（<code>response_format</code>）。模型偶尔报 400 时取消勾选即可</span>
      </label>
      <label class="check">
        <input type="checkbox" id="useProxy" />
        <span>走本地代理转发（浏览器被 CORS 拦住时使用，需先运行 <code>node server.js</code>）</span>
      </label>
      <div class="field" id="proxyField" style="display:none">
        <label for="proxyUrl">代理地址</label>
        <input id="proxyUrl" type="text" spellcheck="false" placeholder="http://localhost:8787" />
      </div>
      <div class="test-result" id="testResult"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="btnTest">测试连接</button>
      <div class="spacer"></div>
      <button class="btn-primary" id="btnSaveSettings">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="app.js"></script>
</body>
</html>
